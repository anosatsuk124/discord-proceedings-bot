# bot と recognizer をまとめて動かす。設定は .env に書く(.env.example を参照)。
#
# デプロイも更新も `git pull && docker compose up -d` だけで済むよう、どちらのサービスも
# up のたびにビルドする(pull_policy: build。変更がなければキャッシュで済む)。
# recognizer は GitHub のリポジトリの master から直接ビルドする。手元の clone を使うときは
# RECOGNIZER_CONTEXT にそのディレクトリを指定する。
name: discord-proceedings

# 録音と議事録の置き場所。無いときに Docker が root 所有で作ってしまわないよう、作らずにエラーにする。
x-data-volume: &data-volume
    type: bind
    source: ${DATA_DIR:-./data}
    target: /data
    bind:
        create_host_path: false

x-hardening: &hardening
    restart: unless-stopped
    # シグナルを子プロセスに渡し、ゾンビを回収する
    init: true
    read_only: true
    tmpfs:
        - /tmp
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    bot:
        <<: *hardening
        build: .
        image: discord-proceedings-bot:latest
        pull_policy: build
        environment:
            DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN を .env に書いてください}
            DATA_DIR: /data
            SILENCE_DURATION_MS: ${SILENCE_DURATION_MS:-1000}
            AUTO_LEAVE_DELAY_SECONDS: ${AUTO_LEAVE_DELAY_SECONDS:-60}
            RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
            # 音声接続(DAVE を含む)のデバッグログ。録音がうまくいかないときに true にする
            VOICE_DEBUG: ${VOICE_DEBUG:-false}
            PROCEEDINGS_TIMEZONE: ${PROCEEDINGS_TIMEZONE:-Asia/Tokyo}
            # 議事録ページの生成。LLM の設定は report-worker にだけ渡す
            REPORT_AGENT: ${REPORT_AGENT:-off}
            REPORT_AUTO_DELAY_HOURS: ${REPORT_AUTO_DELAY_HOURS:-12}
            REPORT_JOB_TIMEOUT_MINUTES: ${REPORT_JOB_TIMEOUT_MINUTES:-240}
            REPORT_PUBLISHER: ${REPORT_PUBLISHER:-simple-static-pager}
            PAGER_REPO: ${PAGER_REPO:-}
            PAGER_BRANCH: ${PAGER_BRANCH:-html}
            PAGER_GITHUB_TOKEN: ${PAGER_GITHUB_TOKEN:-}
        volumes:
            - *data-volume
            - report-jobs:/report-jobs
        # 終了時に録音中の発言を閉じて manifest.json を書く時間
        stop_grace_period: 30s

    # 議事録ページを LLM で作る。COMPOSE_PROFILES=report のときだけ動く。
    # 文字起こしは LLM への入力になるので、Discord と GitHub のトークンや録音はここに渡さない。
    report-worker:
        <<: *hardening
        profiles: ['report']
        build:
            context: .
            target: report-worker
        image: discord-proceedings-report-worker:latest
        pull_policy: build
        environment:
            REPORT_AGENT: ${REPORT_AGENT:-off}
            REPORT_AGENT_MODEL: ${REPORT_AGENT_MODEL:-}
            REPORT_AGENT_EFFORT: ${REPORT_AGENT_EFFORT:-}
            REPORT_AGENT_SANDBOX: ${REPORT_AGENT_SANDBOX:-srt}
            REPORT_AGENT_ALLOWED_DOMAINS: ${REPORT_AGENT_ALLOWED_DOMAINS:-}
            REPORT_AGENT_CONCURRENCY: ${REPORT_AGENT_CONCURRENCY:-3}
            REPORT_AGENT_TASK_TIMEOUT_SECONDS: ${REPORT_AGENT_TASK_TIMEOUT_SECONDS:-900}
            REPORT_AGENT_MAX_BUDGET_USD: ${REPORT_AGENT_MAX_BUDGET_USD:-}
            REPORT_RESEARCH: ${REPORT_RESEARCH:-on}
            REPORT_RESEARCH_ALLOWED_DOMAINS: ${REPORT_RESEARCH_ALLOWED_DOMAINS:-}
            REPORT_RESEARCH_MAX_TOPICS: ${REPORT_RESEARCH_MAX_TOPICS:-10}
            # LLM の認証情報。使う CLI の分だけ .env に書く
            CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
            OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
        security_opt:
            - no-new-privileges:true
            # srt が CLI をさらに包むために、このサービスにだけ user namespace を許す。
            # 既定のプロファイルに clone、unshare、mount、pivot_root、setns を足したもの。
            - seccomp=./docker/report-worker-seccomp.json
            # srt の中に新しい /proc を作るために要る(これがないと PID の隔離が弱いモードになる)。
            - systempaths=unconfined
        tmpfs:
            - /tmp:size=512m
        volumes:
            - report-jobs:/report-jobs

    recognizer:
        <<: *hardening
        build: ${RECOGNIZER_CONTEXT:-https://github.com/anosatsuk124/discord-proceedings-bot-recognizer.git#master}
        image: discord-proceedings-recognizer:latest
        pull_policy: build
        command: ['watch', '/data']
        environment:
            WHISPER_MODEL: ${WHISPER_MODEL:-kotoba-tech/kotoba-whisper-v2.0-faster}
            # モデルを変えたら、ここも変えるか空にする(空なら最新を使う)
            WHISPER_MODEL_REVISION: ${WHISPER_MODEL_REVISION-f44edd35eaeb2274e85ac7b31fb2c6f59ff1c4bc}
            WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
            WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
            # Ryzen 9 7900(12 コア)向け。物理コア数に合わせる。
            WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-12}
            WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ja}
            WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
            WHISPER_CHUNK_LENGTH: ${WHISPER_CHUNK_LENGTH:-15}
            WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${WHISPER_CONDITION_ON_PREVIOUS_TEXT:-false}
            # 無音を VAD で取り除いてから文字起こしする(無音から言っていない文字列が出るのを防ぐ)
            WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
            PROCEEDINGS_TIMEZONE: ${PROCEEDINGS_TIMEZONE:-Asia/Tokyo}
            HF_HOME: /models
            RUST_LOG: ${RUST_LOG:-info}
        volumes:
            - *data-volume
            - models:/models

volumes:
    # ダウンロードしたモデルのキャッシュ
    models:
    # bot と report-worker のあいだの受け渡し。処理中のジョブの文字起こしだけが入る
    report-jobs:
