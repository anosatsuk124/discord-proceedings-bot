<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{pageTitle}}</title>
<style>
{{css}}
</style>
</head>
<body class="report">
<div class="columns">
<header id="top" class="masthead">
{{masthead}}
</header>
<nav id="toc" aria-label="目次">
<form id="tools" role="search" hidden>
<input id="q" type="search" placeholder="全文検索( / )" aria-label="全文検索">
<p id="count" aria-live="polite"></p>
<ul id="speakers" aria-label="話者で絞り込む">{{speakers}}</ul>
<button id="orig" type="button">原文をすべて開く( o )</button>
</form>
<h2>目次</h2>
<ul>
<li><a href="#summary">要約</a></li>
<li><a href="#map">議論マップ</a></li>
</ul>
{{toc}}
<ul>
<li><a href="#references">関連資料</a></li>
</ul>
</nav>
<main>
<section id="summary">
<h2>要約</h2>
{{summary}}
</section>
<section id="map">
<h2>議論マップ</h2>
{{map}}
</section>
<section id="transcript">
<h2>全文</h2>
{{transcript}}
</section>
<section id="references">
<h2>関連資料</h2>
{{sources}}
</section>
</main>
</div>
<script>
{{js}}
</script>
</body>
</html>
